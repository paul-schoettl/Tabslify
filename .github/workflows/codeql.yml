# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '15 14 * * 0'
  workflow_dispatch:

jobs:
  # Checks whether your self-hosted runner is online. Runs on a GitHub-hosted
  # runner itself (it only calls the GitHub API, never touches repo code), so
  # it's safe to run for every event including PRs from forks.
  determine-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.use-runner }}
    steps:
    - name: Check self-hosted runner availability
      id: pick
      env:
        GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
      run: |
        # Same behavior as mikehardy/runner-fallback-action@v1 (repo-level
        # runners, online check), but as plain gh+jq: no third-party action,
        # no Node.js 20 deprecation warning. Output stays a JSON label array,
        # so fromJson() downstream keeps working.
        JSON=$(gh api "repos/${{ github.repository }}/actions/runners?per_page=100" 2>/dev/null || echo '{"runners":[]}')
        ONLINE=$(echo "$JSON" | jq '[.runners[] | select(.status == "online" and ((["self-hosted", "Linux", "X64"] - [.labels[].name]) | length == 0))] | length')
        if [ "$ONLINE" -gt 0 ]; then
          echo 'use-runner=["self-hosted", "Linux", "X64"]' >> "$GITHUB_OUTPUT"
        else
          echo 'use-runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
        fi

  analyze:
    needs: determine-runner
    name: Analyze (${{ matrix.language }})
    timeout-minutes: 45
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    # push/schedule (your own commits) try your PC first via the self-hosted
    # runner - Gradle cache, Android SDK etc. stay warm between runs - and fall
    # back to ubuntu-latest automatically if it's offline. pull_request always
    # stays on a GitHub-hosted runner so code from PRs (e.g. forks, if this
    # repo is ever public) never executes on your machine, self-hosted online
    # or not.
    runs-on: ${{ (github.event_name == 'pull_request' && 'ubuntu-latest') || (matrix.language == 'swift' && 'macos-latest') || fromJson(needs.determine-runner.outputs.runner) }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      # Only needed on the GitHub-hosted fallback - your self-hosted machine
      # already has a JDK (Android Studio's bundled one / whatever's on your
      # PATH) and gradlew will just use that.
      if: matrix.language == 'java-kotlin' && runner.environment == 'github-hosted'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        ram: 6144
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Pin Kotlin to a CodeQL-supported version
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        # The project's real Kotlin version (2.4.20) is newer than the CodeQL
        # extractor currently accepts. This init script forces every
        # org.jetbrains.kotlin:* artifact - including the Kotlin Gradle plugin
        # and the build-tools-api compiler it delegates to - down to 2.4.10
        # (the newest version CodeQL is confirmed to support) for this build only.
        # The repository's own gradle/libs.versions.toml is untouched, so normal
        # (non-CodeQL) builds keep using 2.4.20.
        # TODO: remove this step once CodeQL supports Kotlin 2.4.20+.
        cat > codeql-kotlin-init.gradle.kts <<'KTS'
        allprojects {
            buildscript {
                configurations.all {
                    resolutionStrategy.eachDependency {
                        if (requested.group == "org.jetbrains.kotlin") {
                            useVersion("2.4.10")
                        }
                    }
                }
            }
            configurations.all {
                resolutionStrategy.eachDependency {
                    if (requested.group == "org.jetbrains.kotlin") {
                        useVersion("2.4.10")
                    }
                }
            }
        }
        KTS

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        # google-services.json is git-ignored (it is per-developer config), but the
        # Google Services Gradle plugin refuses to configure without it. Write a
        # placeholder that satisfies the plugin's structure and package-name checks
        # so a debug compile can run. No real Firebase project is contacted at build time.
        cat > app/google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "tabslify-ci",
            "storage_bucket": "tabslify-ci.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.paluss1122.tabslify" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": " " } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            },
            {
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:1111111111111111111111",
                "android_client_info": { "package_name": "com.paluss1122.tabslify.private" }
              },
              "oauth_client": [],
              "api_key": [ { "current_key": " " } ],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }
          ],
          "configuration_version": "1"
        }
        JSON

        # Compile the debug variant only. Release signing and the local.properties
        # secrets are not needed for a debug compile; missing BuildConfig values
        # simply render as the string "null", which compiles fine.
        # --no-build-cache --rerun-tasks are REQUIRED here, not optional:
        # the CodeQL tracer must OBSERVE real compiler invocations. This
        # self-hosted runner shares GRADLE_USER_HOME with local builds, so
        # cache hits or up-to-date tasks would restore outputs without ever
        # running kotlinc/javac -> "no source code seen during build" (exit 32).
        # Local builds are unaffected (their caching lives in gradle.properties).
        ./gradlew --no-daemon --stacktrace \
          --no-build-cache --rerun-tasks \
          -I codeql-kotlin-init.gradle.kts \
          :app:compileDebugSources \
          :extern_accessibily:compileDebugSources

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        ram: 6144
